<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blog | New Glory Resources Store</title>
<meta name="description" content="Gadget tips, buying guides and news from New Glory Resources Store.">
<meta name="theme-color" content="#10192b">
<link rel="icon" href="logo.jpg"><link rel="apple-touch-icon" href="logo.jpg">
<link rel="canonical" href="https://YOURDOMAIN/blog.html">
<meta property="og:type" content="website"><meta property="og:site_name" content="New Glory Resources Store">
<meta property="og:title" content="Blog | New Glory Resources Store">
<meta property="og:description" content="Gadget tips, buying guides and news.">
<meta property="og:url" content="https://YOURDOMAIN/blog.html"><meta property="og:image" content="https://YOURDOMAIN/logo.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>.posts{display:grid;gap:14px}.post img{aspect-ratio:16/9;object-fit:cover;width:100%}.post .in{padding:16px}.body{white-space:pre-wrap;margin-top:12px;max-width:68ch}</style></head><body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
<script>document.body.insertAdjacentHTML('afterbegin',head('b'))</script>
<main class="wrap"><h1 style="margin-bottom:16px">Blog</h1><div class="posts" id="l"><p class="empty">Loading posts…</p></div></main>
<footer>© New Glory Resources Limited</footer>
<script>
const id=new URLSearchParams(location.search).get('p');
const d=s=>new Date(s).toLocaleDateString('en-NG',{day:'numeric',month:'long',year:'numeric'});
let q=sb.from('posts').select('*').order('created_at',{ascending:false});
if(id)q=q.eq('id',id);
q.then(({data,error})=>{
  if(error||!data||!data.length){$('#l').innerHTML='<p class="empty">No posts yet. Check back soon.</p>';return}
  if(id){const p=data[0];document.title=p.title+' | New Glory Resources Store';
    $('#l').innerHTML=`<article class="card post">${p.image_url?`<img src="${esc(p.image_url)}" alt="">`:''}<div class="in"><h2>${esc(p.title)}</h2><p class="mut">${d(p.created_at)}</p><div class="body">${esc(p.body)}</div><p style="margin-top:16px"><a href="blog.html">Back to all posts</a></p></div></article>`;return}
  $('#l').innerHTML=data.map(p=>`<a href="blog.html?p=${p.id}" style="text-decoration:none"><article class="card post">${p.image_url?`<img src="${esc(p.image_url)}" alt="" loading="lazy">`:''}<div class="in"><h2 style="font-size:1.25rem">${esc(p.title)}</h2><p class="mut">${d(p.created_at)}</p><p>${esc(p.body.slice(0,140))}…</p></div></article></a>`).join('');
});
</script></body></html>
